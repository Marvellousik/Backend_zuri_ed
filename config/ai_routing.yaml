version: "2.0"
provider: "openrouter"
default_model: "openrouter/auto"
default_task: "chat"

tasks:
  chat:
    strategy: "speed"
    primary: "openrouter/auto"
    max_tokens: 2048
    temperature: 0.7

  quiz_generation:
    strategy: "quality"
    primary: "openrouter/auto"
    max_tokens: 4096
    temperature: 0.2

  flashcards:
    strategy: "cost"
    primary: "openrouter/auto"
    max_tokens: 2048
    temperature: 0.3

  summarize_document:
    strategy: "cost_quality_balance"
    primary: "openrouter/auto"
    max_tokens: 4096
    temperature: 0.3

  research_assistance:
    strategy: "quality"
    primary: "openrouter/auto"
    max_tokens: 8192
    temperature: 0.4
